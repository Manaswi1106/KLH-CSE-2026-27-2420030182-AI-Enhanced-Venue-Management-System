<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi-Calculator App</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11.5.0/lib/browser/math.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      background-color: #ffc0cb;
      display: flex;
      height: 100vh;
      color: #333;
    }
    .sidebar {
      width: 220px;
      background-color: #fff;
      padding: 20px;
      border-right: 2px solid #ccc;
      display: flex;
      flex-direction: column;
    }
    .sidebar h2 {
      margin-top: 0;
      text-align: center;
    }
    .tab-button {
      padding: 10px;
      margin: 5px 0;
      border: none;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      text-align: left;
    }
    .tab-button.active { background-color: #0056b3; }
    .main {
      flex-grow: 1;
      padding: 30px;
      overflow-y: auto;
    }
    .section {
      display: none;
      max-width: 700px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin: 0 auto;
    }
    .section.active { display: block; }
    h1, h2 { text-align: center; }
    input, select, button, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1em;
      font-family: "Times New Roman", Times, serif;
    }
    button {
      background-color: #28a745;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #218838; }
    .result {
      margin-top: 10px;
      font-weight: bold;
      white-space: pre-line;
    }
    .download-btn {
      background-color: #ff5733;
      margin-top: 10px;
    }
    .download-btn:hover { background-color: #cc4626; }
    canvas { margin-top: 20px; max-width: 100%; }
    table input { width: 60px; margin: 2px; text-align: center; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Calculators</h2>
    <button class="tab-button active" onclick="showSection('standard')">Standard</button>
    <button class="tab-button" onclick="showSection('scientific')">Scientific</button>
    <button class="tab-button" onclick="showSection('graph')">Graphing</button>
    <button class="tab-button" onclick="showSection('bmi')">BMI</button>
    <button class="tab-button" onclick="showSection('currency')">Currency</button>
    <button class="tab-button" onclick="showSection('emi')">EMI</button>
    <button class="tab-button" onclick="showSection('age')">Age</button>
    <button class="tab-button" onclick="showSection('matrix')">Matrix</button>
  </div>
  <div class="main">
    <h1>Multi-Calculator App</h1>

    <div class="section active" id="standard">
      <h2>Standard Calculator</h2>
      <input type="text" id="calcInput" placeholder="e.g. 5 + 3 * 2" />
      <button onclick="calculate()">Calculate</button>
      <div class="result" id="calcResult"></div>
    </div>

    <div class="section" id="scientific">
      <h2>Scientific Calculator</h2>
      <input type="text" id="sciInput" placeholder="e.g. sin(30 deg) + log(100)" />
      <button onclick="calculateScientific()">Evaluate</button>
      <div class="result" id="sciResult"></div>
    </div>

    <div class="section" id="graph">
      <h2>Graphing Calculator</h2>
      <input type="text" id="graphInput" placeholder="Enter equation in x (e.g. x^2 - 4*x + 3)" />
      <button onclick="plotGraph()">Plot</button>
      <button class="download-btn" onclick="downloadGraph()">Download Graph as PNG</button>
      <canvas id="graphCanvas" height="300"></canvas>
    </div>

    <div class="section" id="bmi">
      <h2>BMI Calculator</h2>
      <input type="number" id="height" placeholder="Height in cm">
      <input type="number" id="weight" placeholder="Weight in kg">
      <button onclick="calculateBMI()">Calculate BMI</button>
      <div class="result" id="bmiResult"></div>
    </div>

    <div class="section" id="currency">
      <h2>Currency Converter</h2>
      <input type="number" id="amount" placeholder="Amount in INR" />
      <select id="currencySelect">
        <option value="USD">USD – US Dollar (1 INR = 0.012)</option>
        <option value="EUR">EUR – Euro (1 INR = 0.011)</option>
        <option value="GBP">GBP – British Pound (1 INR = 0.0095)</option>
        <option value="AUD">AUD – Australian Dollar (1 INR = 0.018)</option>
        <option value="JPY">JPY – Japanese Yen (1 INR = 1.75)</option>
        <option value="CAD">CAD – Canadian Dollar (1 INR = 0.016)</option>
      </select>
      <button onclick="convertCurrency()">Convert</button>
      <div class="result" id="currencyResult"></div>
    </div>

    <div class="section" id="emi">
      <h2>EMI Calculator</h2>
      <input type="number" id="loanAmount" placeholder="Loan Amount">
      <input type="number" id="interestRate" placeholder="Annual Interest Rate (%)">
      <input type="number" id="loanTenure" placeholder="Loan Tenure (in years)">
      <button onclick="calculateEMI()">Calculate EMI</button>
      <div class="result" id="emiResult"></div>
    </div>

    <div class="section" id="age">
      <h2>Age Calculator</h2>
      <input type="date" id="dob">
      <button onclick="calculateAge()">Calculate Age</button>
      <div class="result" id="ageResult"></div>
    </div>

    <div class="section" id="matrix">
      <h2>Matrix Calculator (3x3)</h2>
      <table>
        <tbody id="matrixA"></tbody>
      </table>
      <button onclick="calculateMatrix()">Calculate</button>
      <div class="result" id="matrixResult"></div>
    </div>
  </div>

  <script>
    let chartInstance;

    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-button').forEach(b => {
        if (b.getAttribute('onclick').includes(id)) b.classList.add('active');
      });
    }

    function calculate() {
      const input = document.getElementById('calcInput').value;
      try {
        const result = eval(input);
        document.getElementById('calcResult').textContent = `Result: ${result}`;
      } catch (e) {
        document.getElementById('calcResult').textContent = 'Invalid expression.';
      }
    }

    function calculateScientific() {
      const input = document.getElementById('sciInput').value;
      try {
        const result = math.evaluate(input);
        document.getElementById('sciResult').textContent = `Result: ${result}`;
      } catch (e) {
        document.getElementById('sciResult').textContent = 'Invalid scientific expression.';
      }
    }

    function plotGraph() {
      const expression = document.getElementById('graphInput').value;
      const xValues = [], yValues = [];
      for (let x = -10; x <= 10; x += 0.1) {
        try {
          const y = math.evaluate(expression, { x });
          xValues.push(x);
          yValues.push(y);
        } catch (e) {
          alert('Invalid expression');
          return;
        }
      }
      const ctx = document.getElementById('graphCanvas').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: xValues,
          datasets: [{ label: 'f(x)', data: yValues, borderColor: 'blue', fill: false }]
        }
      });
    }

    function downloadGraph() {
      const canvas = document.getElementById('graphCanvas');
      const image = canvas.toDataURL("image/png");
      const link = document.createElement('a');
      link.download = "graph.png";
      link.href = image;
      link.click();
    }

    function calculateBMI() {
      const h = parseFloat(document.getElementById('height').value) / 100;
      const w = parseFloat(document.getElementById('weight').value);
      if (!h || !w) return document.getElementById('bmiResult').textContent = "Enter valid height and weight";
      const bmi = w / (h * h);
      let msg = '';
      if (bmi < 18.5) msg = 'Underweight';
      else if (bmi < 25) msg = 'Normal';
      else if (bmi < 30) msg = 'Overweight';
      else msg = 'Obese';
      document.getElementById('bmiResult').textContent = `Your BMI is ${bmi.toFixed(2)} (${msg})`;
    }

    function convertCurrency() {
      const amount = parseFloat(document.getElementById('amount').value);
      const currency = document.getElementById('currencySelect').value;
      const rates = { USD: 0.012, EUR: 0.011, GBP: 0.0095, AUD: 0.018, JPY: 1.75, CAD: 0.016 };
      if (amount) {
        const result = amount * rates[currency];
        document.getElementById('currencyResult').textContent = `Converted Amount: ${result.toFixed(2)} ${currency}`;
      }
    }

    function calculateEMI() {
      const P = parseFloat(document.getElementById('loanAmount').value);
      const R = parseFloat(document.getElementById('interestRate').value) / 12 / 100;
      const N = parseFloat(document.getElementById('loanTenure').value) * 12;
      const emi = (P * R * Math.pow(1 + R, N)) / (Math.pow(1 + R, N) - 1);
      const total = emi * N;
      const interest = total - P;
      document.getElementById('emiResult').textContent = `Monthly EMI: ₹${emi.toFixed(2)}\nTotal Interest: ₹${interest.toFixed(2)}\nTotal Payable: ₹${total.toFixed(2)}`;
    }

    function calculateAge() {
      const dob = new Date(document.getElementById('dob').value);
      const now = new Date();
      if (!dob.getTime()) {
        document.getElementById('ageResult').textContent = 'Please select a valid date.';
        return;
      }
      const diffMs = now - dob;
      const ageDate = new Date(diffMs);
      const years = ageDate.getUTCFullYear() - 1970;
      const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const minutes = Math.floor(diffMs / (1000 * 60));
      document.getElementById('ageResult').textContent = `Age: ${years} years\nDays: ${days}\nMinutes: ${minutes}`;
    }

    function calculateMatrix() {
      const a = [];
      for (let i = 0; i < 3; i++) {
        const row = [];
        for (let j = 0; j < 3; j++) {
          const val = parseFloat(document.getElementById(`a${i}${j}`).value);
          row.push(val);
        }
        a.push(row);
      }
      try {
        const det = math.det(a);
        const inv = math.inv(a);
        const trans = math.transpose(a);
        document.getElementById('matrixResult').innerText =
          `Determinant: ${det.toFixed(2)}\n\nInverse:\n${inv.map(row => row.map(x => x.toFixed(2)).join(' ')).join('\n')}\n\nTranspose:\n${trans.map(row => row.join(' ')).join('\n')}`;
      } catch (e) {
        document.getElementById('matrixResult').innerText = 'Matrix must be invertible (non-zero determinant).';
      }
    }

    // Populate matrix input fields
    window.onload = () => {
      const table = document.getElementById('matrixA');
      for (let i = 0; i < 3; i++) {
        const tr = document.createElement('tr');
        for (let j = 0; j < 3; j++) {
          const td = document.createElement('td');
          const input = document.createElement('input');
          input.type = 'number';
          input.id = `a${i}${j}`;
          td.appendChild(input);
          tr.appendChild(td);
        }
        table.appendChild(tr);
      }
    }
  </script>
</body>
</html>
